name: azure_databricks_workspace_configuration
version: 0.1.0
description: >
  For each Azure Databricks workspace in the subscription, reports the network
  isolation and encryption posture: whether the control plane allows public network
  access, whether secure cluster connectivity (no public IP) is enabled, whether the
  workspace is injected into a customer-managed VNet, whether managed-disk encryption
  uses a customer-managed key from Key Vault (with the key name, version, vault URI
  and rotation flag), and the workspace SKU — the tier gates the isolation features.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_databricks_workspace_configuration.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

evidence_set:
  reference_id: EVD-AZURE-DBRICKS-CONFIG
  name: Azure Databricks Workspace Configuration
  instructions: >
    Script: fetcher.py. Permissions: the built-in **Reader** role on the subscription
    is sufficient — both calls are GETs, and no Databricks data-plane (workspace API)
    call is made. Azure SDK calls (azure-mgmt-databricks
    AzureDatabricksManagementClient): resource.providers.get("Microsoft.Databricks")
    first, so a zero-workspace result is distinguishable from "Databricks is not in
    use" (the provider is unregistered on most subscriptions and the list then comes
    back empty rather than erroring); then workspaces.list_by_subscription(), whose
    response carries everything else — sku.name / sku.tier, public_network_access,
    required_nsg_rules, provisioning_state, managed_resource_group_id,
    parameters.enable_no_public_ip.value (secure cluster connectivity),
    parameters.custom_virtual_network_id.value (VNet injection) and
    encryption.entities.managed_disk (key_source, key_vault_properties.key_name /
    key_version / key_vault_uri, rotation_to_latest_key_version_enabled). A Key Vault
    URI, or key_source "Microsoft.Keyvault", is what makes the managed-disk key
    customer-managed; the disks are always encrypted, so the fact that varies is who
    holds the key. Workspaces that do not expose enable_no_public_ip at all are
    reported with no_public_ip_setting_present false, so an absent setting is not read
    as "cluster nodes have public IPs".
