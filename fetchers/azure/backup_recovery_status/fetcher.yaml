name: azure_backup_recovery_status
version: 0.1.0
description: >
  Every Recovery Services vault in the subscription with the backup policies it defines
  (schedule, and the full retention policy — daily / weekly / monthly / yearly
  schedules, the flat SQL form and the per-database sub-policies used by SAP HANA and
  SQL-in-VM) and the items it actually protects (workload type, the policy governing
  each, protection state, last backup status and time, last recovery point), plus each
  vault's own soft delete, immutability, multi-user authorization, cross-region restore
  and storage redundancy. Summarized as the fraction of protected items whose policy
  retains backups for at least the stated threshold of 30 days.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_backup_recovery_status.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

evidence_set:
  reference_id: EVD-AZURE-BACKUP-RECOVERY
  name: Azure Backup and Recovery Status
  instructions: >
    Script: fetcher.py. Azure SDK calls:
    resource.providers.get("Microsoft.RecoveryServices") for the resource-provider
    registration state; azure-mgmt-recoveryservices RecoveryServicesClient
    vaults.list_by_subscription_id() for each vault's id, name, location, sku,
    provisioning_state, public_network_access, backup_storage_version and its
    properties.security_settings (soft_delete_settings.soft_delete_state and
    retention days, immutability_settings.state, multi_user_authorization),
    properties.redundancy_settings (cross_region_restore,
    standard_tier_storage_redundancy) and properties.encryption
    (infrastructure_encryption, key_vault_properties.key_uri); then per vault, with
    azure-mgmt-recoveryservicesbackup RecoveryServicesBackupClient,
    backup_policies.list(vault_name, resource_group_name) for each policy's
    schedule_policy and retention_policy (daily / weekly / monthly / yearly schedules
    with their retention_duration {count, duration_type}, the flat SimpleRetentionPolicy
    form, and sub_protection_policy[] for SAP HANA / SQL-in-VM), and
    backup_protected_items.list(vault_name, resource_group_name) for each item's
    workload_type, policy_id, protection_state, protection_status, health_status,
    last_backup_status, last_backup_time and last_recovery_point. Each protected item
    is joined to its policy by policy_id, so the item carries the retention that
    governs it. daily_retention_days is Prowler's exact figure
    (retention_policy.daily_schedule.retention_duration.count);
    max_retention_days is derived across every schedule and sub-policy, converting
    Weeks/Months/Years at 7/30/365 days, so a weekly-only policy is not read as having
    no retention. The threshold is Prowler's MINIMUM_RETENTION_DAYS = 30 and is
    emitted in the payload next to the percentage measured against it. Soft delete
    "AlwaysON" counts as enabled; immutability "Unlocked" or "Locked" counts as
    enabled.
