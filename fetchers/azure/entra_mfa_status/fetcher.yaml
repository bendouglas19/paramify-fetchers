name: azure_entra_mfa_status
version: 0.1.0
description: >
  For every user in the Microsoft Entra ID tenant, reports whether the account is
  enabled, when it last signed in, and whether it is MFA-capable — joining the
  directory's user list against the authentication-methods registration report.
  Coverage is reported over ENABLED users (the accounts that can actually sign in)
  as well as over all users, and broken out for administrators, members and guests,
  with passwordless (phishing-resistant) capability alongside plain MFA.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_entra_mfa_status.json
  aggregation: per_target

target_schema:
  # Microsoft Graph data is TENANT-scoped, so the fanout unit here is the tenant,
  # not the subscription: one target per Entra tenant. Two targets differing only
  # by subscription_id would collect byte-identical evidence.
  tenant_id:
    type: string
    required: false
    env: AZURE_TENANT_ID
    description: >
      Entra tenant id to collect from, and the discriminator for this fetcher's
      output filename. Optional — omit to use whichever tenant the ambient
      credential authenticates into, in which case the tenant is read back from
      Microsoft Graph's organization endpoint.
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id. Optional and NOT used to scope collection — Graph data
      is tenant-wide. Set it only to correlate this tenant's evidence with the
      subscription-scoped Azure evidence from the same manifest; it is recorded in
      the payload metadata and nowhere else.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-tenant runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

evidence_set:
  reference_id: EVD-AZURE-ENTRA-MFA
  name: Microsoft Entra ID MFA Coverage
  instructions: >
    Script: fetcher.py. Microsoft Graph calls (msgraph-sdk GraphServiceClient, built
    on a GraphRequestAdapter so the HTTP transport and the OAuth scope both point at
    the tenant's Graph host): GET /users with
    $select=id,displayName,userPrincipalName,accountEnabled,userType,signInActivity
    for identity, account state and last sign-in (signInActivity is only returned
    when explicitly selected); GET
    /reports/authenticationMethods/userRegistrationDetails for isMfaCapable,
    isMfaRegistered, isPasswordlessCapable, isSsprRegistered, isAdmin and
    methodsRegistered; and GET /organization to record the tenant id and default
    verified domain in the evidence metadata. Both collections are paged manually by
    following @odata.nextLink. The two responses are joined on the user's object id
    (userRegistrationDetails.id is that same id). Graph app permissions needed:
    User.Read.All (or Directory.Read.All), AuditLog.Read.All for signInActivity,
    Reports.Read.All for the registration report, and Organization.Read.All for the
    tenant identity — a denied organization read falls back to AZURE_TENANT_ID and
    is not treated as a collection failure. A user with no registration-details row
    counts as not MFA-capable and is also counted in
    users_without_registration_details, so that assumption stays visible. This
    evidence is tenant-wide; it is NOT scoped by subscription and there is no ARM
    resource provider to report a registration status for.
