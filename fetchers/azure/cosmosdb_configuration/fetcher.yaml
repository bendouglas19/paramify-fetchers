name: azure_cosmosdb_configuration
version: 0.1.0
description: >
  For each Azure Cosmos DB database account in the subscription, reports the API kind
  and the posture around it: whether the data is encrypted with a customer-managed Key
  Vault key (key_vault_key_uri), whether key-based local auth is disabled so only
  Entra ID + RBAC can be used, whether the virtual-network firewall is on and the
  virtual-network / IP allow-lists behind it, public network access, the minimum TLS
  version, private endpoint connections, automatic failover and multi-region writes,
  and the backup policy mode (Continuous ⇒ point-in-time restore). Cosmos DB is always
  encrypted at rest, so the evidence that varies is CMK vs platform-managed, not
  "encrypted: true/false".
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_cosmosdb_configuration.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

evidence_set:
  reference_id: EVD-AZURE-COSMOSDB-CONFIG
  name: Azure Cosmos DB Account Configuration
  instructions: >
    Script: fetcher.py. Azure SDK call (azure-mgmt-cosmosdb CosmosDBManagementClient):
    database_accounts.list() — one subscription-scoped call whose response carries the
    entire projection, so there is no per-resource fan-out. Per account the evidence
    keeps kind, location, database_account_offer_type, document_endpoint,
    key_vault_key_uri, disable_local_auth, default_identity,
    is_virtual_network_filter_enabled, virtual_network_rules[], ip_rules[],
    network_acl_bypass, public_network_access, minimal_tls_version,
    private_endpoint_connections[], enable_automatic_failover,
    enable_multiple_write_locations and backup_policy.type. A non-empty
    key_vault_key_uri ⇒ the account's encryption uses a customer-managed key; absent ⇒
    the Microsoft-managed default. disable_local_auth true ⇒ account keys are refused
    and only Entra ID + RBAC works. public_network_access "Disabled" or
    "SecuredByPerimeter" ⇒ not reachable from the public internet. minimal_tls_version
    is recommended at "Tls12" or "Tls13"; an account that never set the property
    accepts TLS 1.0, so absent is not compliant. backup_policy.type "Continuous" ⇒
    point-in-time restore, "Periodic" ⇒ the older snapshot default. Azure omits
    disable_local_auth, enable_automatic_failover and is_virtual_network_filter_enabled
    when they are false rather than returning false, so each is coerced to a real
    boolean. A subscription that never registered the Microsoft.DocumentDB resource
    provider reports provider_registration_status: not_registered, which is valid
    evidence ("Cosmos DB not in use") rather than an empty result that looks like full
    coverage.
