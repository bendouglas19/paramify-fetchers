name: azure_activity_log_alerts
version: 0.1.0
description: >
  Every activity log alert rule in the subscription — enabled state, scopes,
  description, notification action groups and the decoded conditions each rule fires
  on — plus a derived map of which security-relevant control-plane operations those
  rules actually cover: create/update and delete of network security groups and their
  rules, public IP addresses, policy assignments, SQL server firewall rules and
  security solutions, and whether a Service Health incident alert exists. One evidence
  set answers all of it, rather than one fetcher per operation.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_activity_log_alerts.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

evidence_set:
  reference_id: EVD-AZURE-ACTIVITY-ALERTS
  name: Azure Activity Log Alerts
  instructions: >
    Script: fetcher.py. Azure SDK calls (azure-mgmt-monitor MonitorManagementClient):
    activity_log_alerts.list_by_subscription_id(). Maps to KSI-MLA-02, KSI-MLA-05,
    KSI-CNA-01, KSI-INR-01.
