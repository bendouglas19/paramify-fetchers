name: azure_activity_log_alerts
version: 0.1.0
description: >
  Every activity log alert rule in the subscription — enabled state, scopes,
  description, notification action groups and the decoded conditions each rule fires
  on — plus a derived map of which security-relevant control-plane operations those
  rules actually cover: create/update and delete of network security groups and their
  rules, public IP addresses, policy assignments, SQL server firewall rules and
  security solutions, and whether a Service Health incident alert exists. One evidence
  set answers all of it, rather than one fetcher per operation.
category: azure

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: azure_activity_log_alerts.json
  aggregation: per_target

target_schema:
  subscription_id:
    type: string
    required: false
    env: AZURE_SUBSCRIPTION_ID
    description: >
      Azure subscription id to collect from. Optional — omit to use the first
      enabled subscription the ambient credential can see ("collect where
      deployed"); set one target per subscription to fan out.
  environment:
    type: string
    required: false
    env: AZURE_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the evidence
      metadata. Optional — set per target for multi-subscription runs.

secrets: []          # DefaultAzureCredential only — no handed-over secret (see _categories/azure.yaml)

evidence_set:
  reference_id: EVD-AZURE-ACTIVITY-ALERTS
  name: Azure Activity Log Alerts
  instructions: >
    Script: fetcher.py. Azure SDK calls: resource.providers.get("Microsoft.Insights")
    for the resource-provider registration state, then azure-mgmt-monitor
    MonitorManagementClient activity_log_alerts.list_by_subscription_id() for every
    rule's id, name, location, enabled flag, description, scopes[],
    condition.all_of[] (each entry's field and equals, plus the contains_any and
    any_of[] leaf forms ARM also allows) and actions.action_groups[].action_group_id.
    Each rule's operationName conditions are decoded into monitored_operations, and
    the summary derives monitored_operation_coverage: whether at least one ENABLED
    rule fires on Microsoft.Network/networkSecurityGroups write and delete (including
    the Microsoft.ClassicNetwork delete twin),
    Microsoft.Network/networkSecurityGroups/securityRules write and delete,
    Microsoft.Network/publicIPAddresses write and delete,
    Microsoft.Authorization/policyAssignments write and delete,
    Microsoft.Sql/servers/firewallRules write and delete, and
    Microsoft.Security/securitySolutions write and delete — the operations Prowler
    checks one at a time. service_health_alert_configured additionally requires one
    rule carrying both category == ServiceHealth and properties.incidentType ==
    Incident. A disabled rule contributes no coverage, operation names are compared
    case-insensitively, and the expected operation list is emitted in the payload so
    the evidence carries what it is judged against.
