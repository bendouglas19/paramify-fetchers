name: gcp_gke_cluster_configuration
version: 0.1.0
description: >
  For each GKE cluster in the project, reports the security posture that
  separates a hardened cluster from a default one: private nodes and private
  control-plane endpoint, master-authorized networks, network policy, legacy ABAC
  (the one path that bypasses RBAC), Workload Identity, shielded nodes, Binary
  Authorization, control-plane logging/monitoring components, etcd secrets
  encryption with a CMEK, release channel, and per node pool auto-upgrade,
  auto-repair, boot-disk CMEK and service account.
category: gcp

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: gcp_gke_cluster_configuration.json
  aggregation: per_target

target_schema:
  project:
    type: string
    required: false
    env: GOOGLE_CLOUD_PROJECT
    description: >
      GCP project id to collect from. Optional — omit to use the ADC default
      project ("collect where deployed"); set one target per project to fan out.
  environment:
    type: string
    required: false
    env: GCP_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the
      evidence metadata. Optional — set per target for multi-project runs.

secrets: []          # ADC only — no handed-over secret (see _categories/gcp.yaml)

ksis:
  - KSI-CNA-02       # Attack surface / lateral movement — private nodes, private endpoint, network policy
  - KSI-CNA-07       # Host & container hardening — shielded nodes, secure boot, integrity monitoring
  - KSI-IAM-04       # Least privilege — legacy ABAC off, Workload Identity, non-default node service accounts
  - KSI-SVC-07       # Risk-informed patching — node auto-upgrade + release channel

evidence_set:
  reference_id: EVD-GCP-GKE-CONFIG
  name: GKE Cluster Configuration
  instructions: >
    Script: fetcher.py. Google Cloud client library call: container (GKE)
    clusters.list against projects/<id>/locations/- (one call covers every zonal
    and regional cluster). Per cluster: privateClusterConfig,
    masterAuthorizedNetworksConfig, networkPolicy, legacyAbac,
    workloadIdentityConfig, shieldedNodes, binaryAuthorization, releaseChannel,
    loggingConfig / monitoringConfig component lists, databaseEncryption (etcd
    CMEK) and each nodePool's management.autoUpgrade / autoRepair,
    config.serviceAccount, config.bootDiskKmsKey and
    config.shieldedInstanceConfig. masterAuth is read field-by-field so the
    control plane's client key never enters the evidence. A project with the
    Container API disabled is recorded as not readable rather than failing.
