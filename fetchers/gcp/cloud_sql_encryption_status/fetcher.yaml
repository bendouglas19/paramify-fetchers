name: gcp_cloud_sql_encryption_status
version: 0.1.0
description: >
  For each Cloud SQL instance in the project, reports whether disk encryption at
  rest uses a customer-managed key (CMEK) or the Google-managed key, the KMS key
  name/version where set, plus backup configuration (server-side backup
  protection). Cloud SQL is always encrypted at rest by default, so the evidence
  that varies is CMEK vs Google-managed, not "encrypted: true/false".
category: gcp

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: gcp_cloud_sql_encryption_status.json
  aggregation: per_target

target_schema:
  project:
    type: string
    required: false
    env: GOOGLE_CLOUD_PROJECT
    description: >
      GCP project id to collect from. Optional — omit to use the ADC default
      project ("collect where deployed"); set one target per project to fan out.
  environment:
    type: string
    required: false
    env: GCP_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the
      evidence metadata. Optional — set per target for multi-project runs.

secrets: []          # ADC only — no handed-over secret (see _categories/gcp.yaml)

ksis:
  - KSI-SVC-03       # Protection of data at rest (mirrors aws rds_encryption_status)
  - KSI-RPL-03       # Server-side backup protection — settings.backupConfiguration

evidence_set:
  reference_id: EVD-GCP-CLOUDSQL-ENC
  name: Cloud SQL Encryption
  instructions: >
    Script: fetcher.py. Google Cloud client library call: sqladmin
    instances.list (diskEncryptionConfiguration.kmsKeyName, diskEncryptionStatus,
    settings.backupConfiguration). CMEK present ⇒ customer-managed; absent ⇒
    Google-managed default encryption. NOTE: a test Cloud SQL instance uses the
    Google-managed default (its service agent can't be granted a key until the
    instance exists), so the fixture shows the Google-managed case.
