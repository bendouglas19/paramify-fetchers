name: gcp_iam_custom_roles
version: 0.1.0
description: >
  Every custom IAM role defined for the project — plus the organization's custom
  roles when they are readable, since those are bindable inside the project. For
  each role: its id, launch stage, deleted state, and the full permission list,
  classified into the escalation paths that let a holder step outside the role —
  *.setIamPolicy, iam.serviceAccounts.actAs and the token-signing permissions,
  iam.roles.update and friends, service-account key creation, and create/update on
  a surface that runs code as an attached identity. Also reports how many services
  each role spans and whether it is genuinely read-only.
category: gcp

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: gcp_iam_custom_roles.json
  aggregation: per_target

target_schema:
  project:
    type: string
    required: false
    env: GOOGLE_CLOUD_PROJECT
    description: >
      GCP project id to collect from. Optional — omit to use the ADC default
      project ("collect where deployed"); set one target per project to fan out.
  environment:
    type: string
    required: false
    env: GCP_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the
      evidence metadata. Optional — set per target for multi-project runs.

secrets: []          # ADC only — no handed-over secret (see _categories/gcp.yaml)

evidence_set:
  reference_id: EVD-GCP-IAM-CUSTOM-ROLES
  name: IAM Custom Role Definitions
  instructions: >
    Script: fetcher.py. Google Cloud client library calls: iam roles.list with
    parent projects/<id> and view=FULL — the default BASIC view omits
    includedPermissions, which is the substance of this evidence set — reporting
    each role's name, title, description, stage, deleted flag and permission list.
    The project's organization is then resolved with cloudresourcemanager
    projects.get plus folders.get up the hierarchy, and iam roles.list is repeated
    against organizations/<id> so organization-level custom roles bindable in the
    project are covered; both of those reads sit above the project and are
    tolerated when denied, in which case summary.organization_roles_readable is
    false. Permissions are classified per role: any permission ending in
    .setIamPolicy, the iam.serviceAccounts actAs / getAccessToken / getOpenIdToken
    / implicitDelegation / signBlob / signJwt set, iam.roles create / update /
    delete / undelete, iam.serviceAccountKeys create / update, and create-or-update
    permissions on compute, Cloud Build, Cloud Functions, Cloud Run, Dataflow,
    Dataproc, Composer, Cloud Scheduler, Deployment Manager and organization
    policy. Roles are also measured by how many distinct services their
    permissions span, and marked read-only when every permission's verb is get,
    list, watch, search, view, aggregatedList, getIamPolicy or
    testIamPermissions. An ALPHA-stage role is returned by the API with no stage
    field, so an absent stage is reported as ALPHA.
