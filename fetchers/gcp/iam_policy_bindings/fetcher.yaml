name: gcp_iam_policy_bindings
version: 0.1.0
description: >
  The project's IAM policy, read both ways: every binding with its role and its
  members, and the same policy rolled up per principal so every role one identity
  holds is visible in one place. Flags primitive roles (owner/editor/viewer),
  service accounts granted administrative or primitive roles, allUsers /
  allAuthenticatedUsers members, members outside the organization's domain,
  consumer Google accounts, service accounts owned by another project, and
  bindings gated on an IAM condition. Also reports whether Cloud Audit Logging is
  configured on the policy and which identities are exempted from it.
category: gcp

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: gcp_iam_policy_bindings.json
  aggregation: per_target

target_schema:
  project:
    type: string
    required: false
    env: GOOGLE_CLOUD_PROJECT
    description: >
      GCP project id to collect from. Optional — omit to use the ADC default
      project ("collect where deployed"); set one target per project to fan out.
  environment:
    type: string
    required: false
    env: GCP_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the
      evidence metadata. Optional — set per target for multi-project runs.

config_schema:
  organization_domain:
    type: string
    required: false
    env: GCP_ORGANIZATION_DOMAIN
    description: >
      Your organization's primary domain (e.g. example.com), used to tell members
      inside the organization from external ones. Optional — omit and the fetcher
      reads it from the project's parent organization, a call that sits above the
      project and that a project-scoped read-only role usually cannot make. When
      neither is available the evidence reports
      summary.external_members_evaluated: false rather than zero external members.

secrets: []          # ADC only — no handed-over secret (see _categories/gcp.yaml)

evidence_set:
  reference_id: EVD-GCP-IAM-BINDINGS
  name: IAM Policy Bindings and Audit Configuration
  instructions: >
    Script: fetcher.py. Google Cloud client library calls: cloudresourcemanager
    projects.get (project number, display name, parent, lifecycle state, labels)
    and projects.getIamPolicy requested at policy version 3 so conditional
    bindings return their condition expression. Each binding yields its role, its
    full member list, per-principal-type counts, and the members that are
    allUsers / allAuthenticatedUsers, service accounts, consumer Google accounts,
    or outside the organization domain. The same bindings are rolled up per
    principal, so every role a single identity holds — and therefore any
    separation-of-duties pair, such as cloudkms.admin alongside a crypto-key use
    role — is answerable from the evidence without the fetcher judging it. The
    policy's auditConfigs are reported per service with their log types and the
    members exempted from Data Access logging. Roles count as over-broad when they
    are roles/owner, roles/editor, or any role whose name contains "admin". The
    organization domain comes from GCP_ORGANIZATION_DOMAIN when set, otherwise
    from cloudresourcemanager folders.get / organizations.get walked up from the
    project; those reads sit above the project and are tolerated when denied. This
    evidence set enumerates human identities on purpose — it is the project's
    access inventory. An IAM policy carries no credentials.
