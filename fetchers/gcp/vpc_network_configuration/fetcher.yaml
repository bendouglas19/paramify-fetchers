name: gcp_vpc_network_configuration
version: 0.1.0
description: >
  Network-segmentation evidence for the project: every VPC network with its
  subnet mode (legacy / auto / custom), routing mode, peerings and subnet count,
  and whether the auto-created `default` network still exists; plus every subnet
  with its CIDR range, Private Google Access, and VPC flow logs — enabled or not,
  and when enabled the aggregation interval, flow sampling rate, metadata setting
  and any capture filter.
category: gcp

supports_targets: true

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: gcp_vpc_network_configuration.json
  aggregation: per_target

target_schema:
  project:
    type: string
    required: false
    env: GOOGLE_CLOUD_PROJECT
    description: >
      GCP project id to collect from. Optional — omit to use the ADC default
      project ("collect where deployed"); set one target per project to fan out.
  environment:
    type: string
    required: false
    env: GCP_ENVIRONMENT
    description: >
      Deployment environment label (e.g. prod / preprod) written into the
      evidence metadata. Optional — set per target for multi-project runs.

secrets: []          # ADC only — no handed-over secret (see _categories/gcp.yaml)

evidence_set:
  reference_id: EVD-GCP-VPC-CONFIG
  name: VPC Network Configuration
  instructions: >
    Script: fetcher.py. Google Cloud client library calls: compute
    networks.list (a global resource) and compute subnetworks.aggregatedList
    (one call covers every region). Per network: autoCreateSubnetworks —
    absent means a legacy pre-subnet network, true means auto mode, false means
    custom mode — plus routingConfig.routingMode, mtu, peerings, the subnetwork
    list, networkFirewallPolicyEnforcementOrder, and whether the network is named
    `default`. Per subnet: ipCidrRange, purpose, role, stackType,
    privateIpGoogleAccess, and flow logs from logConfig (enable,
    aggregationInterval, flowSampling, metadata, filterExpr), falling back to the
    deprecated top-level enableFlowLogs when logConfig is absent. A project with
    the Compute API disabled is recorded as not readable rather than failing.
