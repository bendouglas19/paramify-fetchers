name: demo_vuln_scan
version: 0.1.0
description: >
  Synthetic vulnerability-scan summary that takes a couple of seconds and logs its
  progress, so a demo run has something to watch stream. Not real evidence.
category: demo

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: demo_vuln_scan.json

secrets: []

config_schema:
  stage_delay_ms:
    type: integer
    required: false
    default: 450
    env: DEMO_STAGE_DELAY_MS
    description: >
      Pause between the four synthetic scan stages, in milliseconds. Exists so the
      run is slow enough to watch; set it to 0 to make the fetcher instant.

evidence_set:
  reference_id: EVD-DEMO-VULN-SCAN
  name: Demo — Synthetic Vulnerability Scan Summary
  instructions: >
    Script: fetcher.py. Emits a fixed synthetic scan summary, pausing between
    stages so the run streams. Requires no credentials or network access. For
    trying the pipeline only.
