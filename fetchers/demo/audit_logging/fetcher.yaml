name: demo_audit_logging
version: 0.1.0
description: >
  Synthetic audit-logging configuration per account and region, where one account
  in the shipped demo manifest deliberately cannot read one of its regions — so a
  run shows an isolated fanout failure, a partial collection that still writes
  what it got, and the reported failure reason that lands in the envelope's
  metadata.error. Not real evidence.
category: demo

supports_targets: true

target_schema:
  account:
    type: string
    required: true
    env: DEMO_ACCOUNT
    description: >
      Name of the synthetic account to report on. demo-prod-1 and demo-prod-2
      read cleanly; demo-sandbox has one unreadable region, so it writes partial
      evidence and exits non-zero with a reported reason — which is how the demo
      shows an isolated fanout failure and envelope error reporting.

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: demo_audit_logging.json
  aggregation: per_target

secrets: []

evidence_set:
  reference_id: EVD-DEMO-AUDIT-LOGGING
  name: Demo — Synthetic Audit Logging Configuration
  instructions: >
    Script: fetcher.py. Emits a fixed synthetic audit-trail configuration for each
    region of the account named in DEMO_ACCOUNT. demo-sandbox has one deliberately
    unreadable region, so it writes partial evidence and exits non-zero with a
    reported reason. Requires no credentials or network access. For trying the
    pipeline only.
