name: demo_access_review
version: 0.1.0
description: >
  Synthetic quarterly access review that reads one credential, so a demo run can
  show what a fetcher with a secret does — including how `paramify doctor` reports
  a missing one, and how an optional credential differs from a required one. Any
  non-empty value satisfies it; nothing is sent anywhere. Not real evidence.
category: demo

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: demo_access_review.json

secrets:
  - name: api_token
    env: DEMO_API_TOKEN
    description: >
      Stands in for the credential a real fetcher would authenticate with. Any
      non-empty value works — it is never sent anywhere and never written to the
      evidence. Set it to anything (`export DEMO_API_TOKEN=demo`) to see the run
      go green.
  - name: service_account_key
    env: DEMO_SERVICE_ACCOUNT_KEY
    required: false
    description: >
      Optional second credential, here to show what an optional secret looks like:
      the ambient-identity case, where a fetcher CAN take a static key but does not
      need one. Omit it and the fetcher records that it fell back to the ambient
      path; `paramify doctor` does not count it missing.

evidence_set:
  reference_id: EVD-DEMO-ACCESS-REVIEW
  name: Demo — Synthetic Quarterly Access Review
  instructions: >
    Script: fetcher.py. Emits a fixed synthetic access-review roster. Reads
    DEMO_API_TOKEN (any value) and optionally DEMO_SERVICE_ACCOUNT_KEY; makes no
    network calls. For trying the pipeline only.
