# The demo program — the whole pipeline, no credentials.
#
#     paramify doctor manifests/demo.yaml     # what it needs (one env var)
#     export DEMO_API_TOKEN=demo              # any value; goes nowhere
#     paramify run manifests/demo.yaml        # collect
#     paramify runs                           # what it produced
#
# Every fetcher here is synthetic: fixed, obviously-fake payloads, no network, no
# cloud account. It exists so a first run shows the shapes you will meet with real
# fetchers — a single collection, a fanout across accounts, a fanout where one
# target fails and the others carry on, a slow one that streams progress, and one
# that reads a credential.
#
# The run ends PARTIAL on purpose: demo_audit_logging cannot collect from
# demo-sandbox, reports why, and the other two accounts still succeed. That is
# what a healthy failure looks like — isolated, and explained in the envelope's
# metadata.error rather than left to be guessed at.
#
# This is the one manifest the repo ships. Copy it to start your own
# (`paramify manifest new my-program`) or delete it; nothing depends on it.

run:
  output_dir: ./evidence

  fetchers:
    # The simplest case: one fetcher, one file, no secrets and no targets.
    - use: demo_hello

    # Slow on purpose (four stages, ~1.8s) so a run has something to watch.
    # Set stage_delay_ms to 0 to make it instant.
    - use: demo_vuln_scan
      config:
        stage_delay_ms: 450

    # Fanout: one invocation per account, one evidence file each.
    - use: demo_encryption_at_rest
      targets:
        - account: demo-prod-1
        - account: demo-prod-2
        - account: demo-sandbox

    # Fanout with an isolated failure — demo-sandbox has audit logging turned
    # off, so that target exits non-zero with a reported reason while the other
    # two collect normally. The fetcher's status ends up `partial`.
    - use: demo_audit_logging
      targets:
        - account: demo-prod-1
        - account: demo-prod-2
        - account: demo-sandbox

    # Takes a credential. api_token is required — `paramify doctor` reports it
    # missing until DEMO_API_TOKEN is set to anything at all. The optional
    # service_account_key is left unwired on purpose: an optional secret a
    # manifest omits is simply not injected, and doctor does not count it against
    # you.
    - use: demo_access_review
      secrets:
        api_token: ${env:DEMO_API_TOKEN}
