# Azure key management, monitoring and backup evidence — the key vaults that hold
# the keys, the rotation policies on those keys, the Activity Log export that records
# who touched them, the alerts that fire when someone changes the controls around
# them, and the Recovery Services vaults that make it all recoverable.
#
# Auth is azure-identity's DefaultAzureCredential — there is no secret to set.
#   - Local:      az login          (cached CLI token under $HOME)
#   - In-cluster: AKS workload identity (AZURE_TENANT_ID + AZURE_CLIENT_ID +
#                 AZURE_FEDERATED_TOKEN_FILE; no stored secret)
#   - Azure VM / App Service: managed identity via IMDS (nothing to wire)
# See fetchers/_categories/azure.yaml for the full resolution order.
#
# Read-only access needed: the built-in **Reader** role on each subscription in
# `targets` covers everything except one thing — azure_key_vault_key_rotation also
# reads each vault's DATA plane to get the key rotation policies, and Reader conveys
# no Key Vault data actions. Add **Key Vault Reader** (RBAC vaults) or a
# get/list-keys access policy (non-RBAC vaults) to see them. Without it the fetcher
# still succeeds: each vault is reported with `data_plane_status: inaccessible`, which
# is itself accurate evidence about what the collector can see.
#
# Nothing here writes, and no key material or secret value is ever read — key names,
# dates, public parameters and rotation policies only.
#
# Fanout is per SUBSCRIPTION. Each fetcher lists one target per subscription;
# `environment` labels that subscription's evidence (prod / preprod) and is written
# into the payload metadata. Omitting `subscription_id` falls back to the first
# enabled subscription the ambient credential can see ("collect where deployed") —
# here it is named explicitly so the run is reproducible and multi-subscription
# ready.
#
# Replace the subscription id below with your own.
run:
  output_dir: ./evidence

  platforms:
    azure:
      # Optional: let the ambient credential-chain selectors through the runner's
      # env whitelist. They only take effect if actually set, and none is a secret
      # on the workload-identity / managed-identity paths. The category file
      # already declares this set; repeating it here documents the run's auth path.
      auth:
        passthrough_env:
          - AZURE_TENANT_ID
          - AZURE_CLIENT_ID
          - AZURE_FEDERATED_TOKEN_FILE

  fetchers:
    - use: azure_key_vault_configuration
      targets:
        - subscription_id: 00000000-0000-0000-0000-000000000000
          environment: preprod

    - use: azure_key_vault_key_rotation
      targets:
        - subscription_id: 00000000-0000-0000-0000-000000000000
          environment: preprod

    - use: azure_diagnostic_settings
      targets:
        - subscription_id: 00000000-0000-0000-0000-000000000000
          environment: preprod

    - use: azure_activity_log_alerts
      targets:
        - subscription_id: 00000000-0000-0000-0000-000000000000
          environment: preprod

    - use: azure_backup_recovery_status
      targets:
        - subscription_id: 00000000-0000-0000-0000-000000000000
          environment: preprod
